name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest ruff
          python -m pip install -e .

      - name: Lint (ruff)
        run: |
          python -m ruff check core hive tests attacks

      - name: Compile (syntax)
        run: |
          python -m compileall -q core hive tests

      - name: Unit Tests (pytest)
        run: |
          python -m pytest tests/ -q --tb=short

      - name: "Integration: Rate Limit Suite"
        run: |
          python attacks/idre_rate_limit_suite.py --n 50
