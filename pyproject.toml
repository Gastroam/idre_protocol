[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idre_clean"
version = "0.1.0"
description = "IDRE Protocol V12 Clean Implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = [
    "core",
    "hive",
    "scripts",
    "attacks",
    "vendor",
    "vendor.mti_evo",
    "vendor.mti_evo.core",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  "vendor",
  "logs",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = [
  "E501",  # line length handled by formatter policy; keep CI noise low
  "E402",  # scripts may intentionally tweak sys.path before importing package modules
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
